<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todas las recetas · La Cocina de la Afri</title>
  <meta name="description" content="Catálogo completo de las recetas de la Afri, con buscador y filtros por categoría.">
  <meta name="theme-color" content="#fbf8f2">
  <link rel="icon" type="image/png" href="assets/logo/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Todas las recetas · La Cocina de la Afri">
  <meta property="og:image" content="assets/logo/logo-480.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400..700;1,400..600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="recetas">
  <div id="cabecera"></div>

  <main id="contenido">
    <header class="cabecera-pagina">
      <div class="contenedor">
        <p class="antetitulo">El recetario</p>
        <h1 id="titulo-catalogo">Todas las recetas</h1>
        <p>Busca por nombre o ingrediente, o filtra por categoría.</p>
      </div>
    </header>

    <div class="filtros">
      <div class="contenedor">
        <form class="buscador" role="search" id="form-busqueda">
          <label class="visualmente-oculto" for="busqueda">Buscar recetas</label>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="busqueda" name="q" placeholder="Buscar: lentejas, bizcocho, chocolate…" autocomplete="off" enterkeyhint="search">
          <button type="button" class="buscador__limpiar" id="limpiar-busqueda" aria-label="Borrar búsqueda" hidden>×</button>
        </form>
        <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
      </div>
    </div>

    <section class="contenedor" aria-labelledby="titulo-catalogo" style="padding-bottom: clamp(56px, 8vw, 96px)">
      <div class="resultados-info">
        <p id="estado" role="status" aria-live="polite"></p>
        <button type="button" class="boton boton--texto" id="restablecer" hidden>Restablecer filtros</button>
      </div>
      <div class="rejilla" id="resultados"></div>
      <div class="vacio" id="vacio" hidden>
        <h2>No hay recetas con esa búsqueda</h2>
        <p>Prueba con otra palabra o quita el filtro de categoría.</p>
        <button type="button" class="boton boton--principal" id="restablecer-vacio">Ver todas las recetas</button>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="data/sitio.js"></script>
  <script src="data/categorias.js"></script>
  <script src="data/recetas.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
